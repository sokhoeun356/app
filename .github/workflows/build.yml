name: Build APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Website URL'
        required: true
        default: 'https://x1oneaiweb2app.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'x1One AI Web2app'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web2App Android Project
        run: |
          mkdir -p app/src/main/java/com/xone/app
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "x1OneWeb2App"
          include ':app'
          EOF

          # build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.xone.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.xone.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          EOF

          # MainActivity.java (with x1One AI session-based branding bar)
          cat << 'EOF' > app/src/main/java/com/xone/app/MainActivity.java
          package com.xone.app;
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static boolean isBrandingClosed = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(-1, -1));

                  // x1One AI Session Branding Bar
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setBackgroundColor(0xEE0E1526);
                  bar.setPadding(30, 20, 30, 20);
                  
                  TextView tv = new TextView(this);
                  tv.setText("⚡ x1One AI Web2app Engine");
                  tv.setTextColor(0xFFFACC15);
                  tv.setTextSize(12);
                  tv.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1.0f));
                  bar.addView(tv);

                  TextView closeBtn = new TextView(this);
                  closeBtn.setText(" ✕ ");
                  closeBtn.setTextColor(0xFFFFFFFF);
                  closeBtn.setTextSize(14);
                  closeBtn.setOnClickListener(v -> {
                      bar.setVisibility(View.GONE);
                      isBrandingClosed = true;
                  });
                  bar.addView(closeBtn);

                  FrameLayout.LayoutParams barParams = new FrameLayout.LayoutParams(-1, -2);
                  barParams.gravity = android.view.Gravity.BOTTOM;
                  root.addView(bar, barParams);

                  if (isBrandingClosed) {
                      bar.setVisibility(View.GONE);
                  }

                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("${{ github.event.inputs.web_url }}");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # Gradle Wrapper Configuration
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download official gradle wrapper executable
          curl -s -o gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x gradlew

      - name: Compile Real Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: x1OneAI-Web2App-APK
          path: app/build/outputs/apk/debug/*.apk
